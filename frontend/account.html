<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moje konto – J4R0 PC</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .auth-wrap { max-width: 480px; margin: 60px auto; }
    .tabs { display:flex; gap:8px; padding:12px; justify-content:center; }
    .auth-form { display:grid; gap:16px; padding:24px; }
    .field { display:grid; gap:6px; }
    .field label { font-size:13px; color:var(--muted); }
    .field input {
      padding:10px 12px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--card);
      color:var(--text);
      font-size:14px;
    }
    .auth-form button { width:100%; margin-top:8px; }
    .muted-note { text-align:center; color:var(--muted); font-size:13px; margin-top:12px; }
  </style>
</head>
<body>
  <header>
    <div class="nav">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">⚙️</div>
        <span>Moje konto</span>
      </div>
      <nav class="row-flex">
        <a class="btn ghost" href="index.html">Sklep</a>
        <a class="btn ghost" href="builder.html">Kreator zestawu</a>
        <a class="btn ghost" href="about.html">Projekt Inżynierski - informacje</a>
      </nav>
      <div class="nav-actions">
        <button class="btn" id="themeToggle" title="Przełącz motyw">🌓</button>
        <a class="btn primary" href="cart.html">Koszyk (<span id="cartCount">0</span>)</a>
        <a class="btn account" href="account.html" id="accountBtn">Moje konto</a>
      </div>
    </div>
  </header>

  <main class="auth-wrap card">
    <div class="tabs">
      <button class="btn primary" data-mode="login">Zaloguj</button>
      <button class="btn" data-mode="register">Załóż konto</button>
    </div>

    <!-- FORMULARZ LOGOWANIA -->
    <form id="loginForm" class="auth-form">
      <div class="field">
        <label for="login_email">Adres e-mail</label>
        <input id="login_email" type="email" placeholder="np. student@example.com" required />
      </div>
      <div class="field">
        <label for="login_password">Hasło</label>
        <input id="login_password" type="password" placeholder="••••••••" required />
      </div>
      <button class="btn primary" type="submit">Zaloguj</button>
      <p class="muted-note">Nie masz konta? Wybierz zakładkę „Załóż konto”.</p>
    </form>

    <!-- FORMULARZ REJESTRACJI -->
    <form id="regForm" class="auth-form" style="display:none;">
      <div class="field">
        <label for="reg_name">Imię i nazwisko</label>
        <input id="reg_name" placeholder="Imie Nazwisko" required />
      </div>
      <div class="field">
        <label for="reg_email">Adres e-mail</label>
        <input id="reg_email" type="email" placeholder="np. student@example.com" required />
      </div>
      <div class="field">
        <label for="reg_phone">Telefon (opcjonalnie)</label>
        <input id="reg_phone" type="tel" placeholder="Nr telefonu" />
      </div>
      <div class="field">
        <label for="reg_address">Adres</label>
        <input id="reg_address" placeholder="ul. Przykładowa 1, 00-000 Miasto" />
      </div>
      <div class="field">
        <label for="reg_password">Hasło</label>
        <input id="reg_password" type="password" placeholder="min. 8 znaków" required />
      </div>
      <button class="btn primary" type="submit">Załóż konto</button>
    </form>
  </main>

  <footer id="siteFooter">
    <details id="aboutDetails">
      <summary class="footer-toggle">O projekcie <span class="chevron">⌄</span></summary>
      <div class="footer-content">
        <p class="muted">
          System wspomagający inteligentne składanie zestawów komputerowych –  
          Projekt inżynierski Piotr Kupczyk, Teleinformatyka S1
        </p>
      </div>
    </details>
  </footer>

  <div id="toastHost"></div>

  <script>
    const API_BASE = localStorage.getItem('API_BASE') || 'http://127.0.0.1:8000';

  function splitName(full) {
    const t = (full || '').trim().split(/\s+/);
    if (t.length === 0) return { imie: null, nazwisko: null };
    if (t.length === 1)   return { imie: t[0],  nazwisko: null };
    return { imie: t[0], nazwisko: t.slice(1).join(' ') };
  }
    const loginForm = document.getElementById('loginForm');
    const regForm = document.getElementById('regForm');
    const tabs = document.querySelector('.tabs');

    function setMode(mode) {
      loginForm.style.display = mode === 'login' ? 'grid' : 'none';
      regForm.style.display = mode === 'register' ? 'grid' : 'none';
      tabs.querySelectorAll('button').forEach(b => b.classList.toggle('primary', b.dataset.mode === mode));
    }

    tabs.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-mode]');
      if (!btn) return;
      setMode(btn.dataset.mode);
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login_email').value.trim();
      const password = document.getElementById('login_password').value;
      try {
        const r = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        if (!r.ok) throw new Error('Nieprawidłowe dane logowania');
        toast('Zalogowano ✅');
      } catch {
        toast('Nie udało się zalogować ❌', 'error');
      }
    });

    regForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const { imie, nazwisko } = splitName(document.getElementById('reg_name').value);

    const payload = {
      imie,
      nazwisko,
      email:   document.getElementById('reg_email').value.trim(),
      telefon: (document.getElementById('reg_phone').value || '').trim() || null,
      adres:   (document.getElementById('reg_address').value || '').trim() || null,
      password: document.getElementById('reg_password').value
    };

    try {
      const r = await fetch(`${API_BASE}/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!r.ok) throw new Error(await r.text());
      toast('Konto utworzone 🎉 – zaloguj się', 'success');
      setMode('login');
    } catch (err) {
      toast('Rejestracja nieudana ❌', 'error');
      console.error(err);
    }
  });

    function toast(msg, type = 'success') {
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.textContent = msg;
      document.getElementById('toastHost').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    setMode('login');
  </script>
  <script src="assets/app.js" defer></script>
  <script src="assets/cart_count.js" defer></script>
</body>
</html>
